{% extends "base.html" %}
{% block content %}
<div class="container text-center">
  <h2>{{ forecast_type }} Result</h2>
  {% if mape is not none %}
  <p>MAPE for the last six months: {{ mape|round(2) }}%</p>
  {% endif %}
  
  <div id="forecastChart" style="width:100%; height:600px;"></div>
  <div class="mt-3">
    <h4>Module Description</h4>
    <p>{{ module_description }}</p>
  </div>
  <br>
  <a href="/" class="btn btn-secondary">Try another file</a>
</div>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script>
  var XAXIS = {{ xaxis|tojson }};
  var DATA = {{ data|tojson }};
  console.log(DATA)
  console.log(XAXIS)

  function buildTrace(type, humanName, color, extraProps={}) {
    var filtered = DATA.find(item => item.type === type);
    if (filtered) {
      data = filtered.data;
      return {
        x: data.map(item => item.x),
        y: data.map(item => item.y),
        mode: 'lines+markers',
        name: humanName,
        line: { color: color },
        ...extraProps,
      };
    }
    return false;
  };

  var traceTrainActual = buildTrace("train_actual", "Training Actual", "blue");
  var traceTrainPred = buildTrace("train_pred", "Training Prediction", "orange");
  var traceTestActual = buildTrace("test_actual", "Testing Actual", "green");
  var traceTestPred = buildTrace("test_pred", "Testing Prediction", "red");

  var traceActual = buildTrace("actual", "Actual", "blue");
  var traceForecast = buildTrace("forecast", "Forecast", "green");
  var traceTrueForecast = buildTrace("true_future", "True Future", "red");

  var traceXGBForecast = buildTrace("xgb_forecast", "XGB Forecast", "green");
  var traceProphetForecast = buildTrace("prophet_forecast", "Prophet Forecast", "green");
  var traceCombinedForecast = buildTrace("combined_forecast", "Combined Forecast", "green");

  var traceActual1 = buildTrace("actual_1", "Actual 1", "blue");
  var traceActual2 = buildTrace("actual_2", "Actual 2", "blue");
  var traceActual3 = buildTrace("actual_3", "Actual 3", "blue");

  var traceForecast1 = buildTrace("forecast_1", "Forecast 1", "green");
  var traceForecast2 = buildTrace("forecast_2", "Forecast 2", "green");
  var traceForecast3 = buildTrace("forecast_3", "Forecast 3", "green");

  var traceTrueFuture1 = buildTrace("true_future_1", "True Future 1", "red");
  var traceTrueFuture2 = buildTrace("true_future_2", "True Future 2", "red");
  var traceTrueFuture3 = buildTrace("true_future_3", "True Future 3", "red");

  var traceActualService1 = buildTrace("actual_service_1", "Service 1 Actual", "blue");
  var traceActualService2 = buildTrace("actual_service_2", "Service 2 Actual", "blue");
  var traceActualService3 = buildTrace("actual_service_3", "Service 3 Actual", "blue");
  var traceActualService4 = buildTrace("actual_service_4", "Service 4 Actual", "blue");

  var traceForecastService1 = buildTrace("forecast_service_1", "Service 1 Forecast", "green");
  var traceForecastService2 = buildTrace("forecast_service_2", "Service 2 Forecast", "green");
  var traceForecastService3 = buildTrace("forecast_service_3", "Service 3 Forecast", "green");
  var traceForecastService4 = buildTrace("forecast_service_4", "Service 4 Forecast", "green");


  var data = [
    traceTrainActual, 
    traceTrainPred, 
    traceTestActual, 
    traceTestPred,
    traceActual,
    traceForecast,
    traceXGBForecast,
    traceProphetForecast,
    traceCombinedForecast,
    traceTrueForecast,
    traceActual1,
    traceActual2,
    traceActual3,
    traceForecast1,
    traceForecast2,
    traceForecast3,
    traceTrueFuture1,
    traceTrueFuture2,
    traceTrueFuture3,
    traceActualService1,
    traceActualService2,
    traceActualService3,
    traceActualService4,
    traceForecastService1,
    traceForecastService2,
    traceForecastService3,
    traceForecastService4,
  ].filter(item => item !== false);
  
  var layout = {
    xaxis: XAXIS,
    yaxis: { title: 'Orders Count (normalized)' },
    dragmode: 'zoom'
  };

  Plotly.newPlot('forecastChart', data, layout);
</script>
{% endblock %}
